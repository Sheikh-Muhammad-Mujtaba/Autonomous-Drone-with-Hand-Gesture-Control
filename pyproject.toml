[project]
name = "journalism-drone"
version = "0.1.0"
description = "Autonomous journalism drone with hand-gesture control, reporter tracking and voice commands (DJI Tello)."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# TensorFlow 2.17 + MediaPipe 0.10.14 (mp.solutions API) are only tested on 3.10.
requires-python = "==3.10.*"
dependencies = [
    # Pinned core: NumPy 2 / newer MediaPipe / protobuf 5 break the vision stack.
    "numpy==1.26.4",
    "opencv-contrib-python==4.10.0.84",
    "mediapipe==0.10.14",
    "protobuf==4.25.9",
    "tensorflow==2.17.1",
    # On Windows the real TensorFlow code lives in tensorflow-intel; its wheel metadata
    # differs per platform, so uv's lock misses it unless it is declared explicitly.
    "tensorflow-intel==2.17.1; sys_platform == 'win32'",
    "keras==3.12.4",
    "scikit-learn==1.7.2",
    # Person tracking
    "ultralytics==8.4.173",
    "lapx==0.10.0",
    # Drone, UI, data
    "djitellopy==2.5.0",
    "pygame==2.6.1",
    "matplotlib==3.10.9",
    "pandas==2.3.3",
    # Voice pipeline
    "faster-whisper==1.2.1",
    "huggingface-hub==2.1.1",
    "sounddevice==0.5.6",
    "webrtcvad-wheels==2.0.14.post1",
    "pyttsx3==2.99",
    # LLM / VLM clients
    "google-genai==2.28.0",
    "groq==1.7.0",
    "openai==3.24.0",
    "python-dotenv==1.2.4",
]

[tool.uv]
# Application, not a library: install dependencies only, never build the project.
package = false
# ultralytics and djitellopy request opencv-python, which overwrites the cv2
# module from opencv-contrib-python (and drops CascadeClassifier). Never install it.
exclude-dependencies = ["opencv-python"]
# Developed and flight-tested on 64-bit Windows; the lock must always have wheels for it.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# Newer tensorflow-io-gcs-filesystem releases ship no Windows wheels.
constraint-dependencies = [
    "tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'",
    # ultralytics dependency; keep the tested major version.
    "polars<2",
]
